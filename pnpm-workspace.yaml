blockExoticSubdeps: true
preferFrozenLockfile: true
minimumReleaseAge: 1440 # >=1 day
minimumReleaseAgeExclude:
  - "@pretty-cozy/oxlint-config@0.1.0"

allowBuilds:
  docsify: false

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1 # https://github.com/npm/node-semver/issues/838

packages:
  - packages/*
  - demo/*
  - docs
